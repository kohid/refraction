name: Release

# Pushing a tag such as v0.1.0 builds dist/refraction.zip and attaches it to a GitHub Release.
# The plugin's built-in updater reads the asset named "refraction.zip" from the latest release.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package:
    name: Build and publish refraction.zip
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up PHP and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          extensions: mbstring, zip

      - name: Install npm dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      # Installs production Composer dependencies, runs `npm run build`, packages dist/refraction.zip
      # and fails if the tag (vX.Y.Z) does not match the version in refraction.php, readme.txt and package.json.
      - name: Build release package
        run: node scripts/build-release.mjs --tag "${GITHUB_REF_NAME}"

      - name: Checksum
        run: cd dist && sha256sum refraction.zip | tee refraction.zip.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/refraction.zip
            dist/refraction.zip.sha256
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
